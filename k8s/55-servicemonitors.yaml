apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: inference
  labels: { app: vllm }
spec:
  namespaceSelector:
    matchNames: [inference]
  selector:
    matchLabels:
      app: vllm
      monitor: "true"
  # targetLabels copies the Service's `role` label onto every series, which is what
  # the AnalysisTemplate keys on to compare canary against stable.
  targetLabels: [role]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy
  namespace: inference
  labels: { app: envoy }
spec:
  namespaceSelector:
    matchNames: [inference]
  selector:
    matchLabels: { app: envoy }
  endpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dcgm-exporter
  namespace: inference
  labels: { app: dcgm-exporter }
spec:
  namespaceSelector:
    matchNames: [inference]
  selector:
    matchLabels: { app: dcgm-exporter }
  endpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argo-rollouts
  namespace: inference
  labels: { app: argo-rollouts }
spec:
  namespaceSelector:
    matchNames: [argo-rollouts]
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
