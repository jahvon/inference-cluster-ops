              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Queueing time",
          "description": "Time spent waiting before the scheduler admits a request. Bimodal by nature: near zero until the batch fills, then a cliff. p99 moves first.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:queue_seconds:p95",
              "legendFormat": "p95",
              "refId": "X",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:queue_seconds:p99",
              "legendFormat": "p99",
              "refId": "Y",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Prefill vs decode",
          "description": "Which phase a request spends its time in. Prefill scales with prompt length, decode with answer length; a shift between them usually means the traffic mix changed, not the server.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:prefill_seconds:p95",
              "legendFormat": "prefill p95",
              "refId": "Z",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:decode_seconds:p95",
              "legendFormat": "decode p95",
              "refId": "A",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 17,
          "type": "row",
          "title": "Saturation and GPU",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "panels": []
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "GPU activity",
          "description": "'engine active' is the fraction of time the compute engine was really executing and is the number to trust. DCGM_FI_DEV_GPU_UTIL is shown only for contrast: it reports whether ANY kernel was resident, so with two pods time-slicing one L4 it pins near 100% whether the GPU is saturated or idle.\n\nIf the two 'active' series are empty, the DCP profiling fields are not being exported -- see k8s/35-dcgm-exporter.yaml.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:gpu:engine_active",
              "legendFormat": "engine active",
              "refId": "B",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:gpu:tensor_active",
              "legendFormat": "tensor active",
              "refId": "C",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:gpu:util_coarse",
              "legendFormat": "DCGM_FI_DEV_GPU_UTIL",
              "refId": "D",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "KV cache and GPU memory",
          "description": "KV cache is vLLM's own accounting of its fixed allocation; GPU memory is the whole device, including both pods and the CUDA contexts.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:kv_cache_usage:max",
              "legendFormat": "KV cache used",
              "refId": "E",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:gpu:memory_used_ratio",
              "legendFormat": "GPU memory used",
              "refId": "F",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Preemptions",
          "description": "vLLM evicting a running request to reclaim KV cache. Anything sustained here means the cache is undersized for the concurrency, and it shows up to users as ITL spikes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 39
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:preemptions:rate5m",
              "legendFormat": "preemptions/s",
              "refId": "G",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "GPU power",
          "description": "A useful independent check on the utilisation graphs: real compute draws real watts, and an idle GPU cannot fake it.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 39
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "avg(DCGM_FI_DEV_POWER_USAGE)",
              "legendFormat": "power",
              "refId": "H",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Request outcomes",
          "description": "Why requests ended. 'length' means the output cap was hit rather than the model choosing to stop; 'abort' is a disconnected client; 'error' is a real failure.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 39
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sum by (finished_reason) (rate(vllm:request_success_total[$__rate_interval]))",
              "legendFormat": "{{finished_reason}}",
              "refId": "I",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 23,
          "type": "row",
          "title": "Errors and tenants",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 46
          },
          "panels": []
        },
        {
          "id": 24,
          "type": "timeseries",
          "title": "Error ratio",
          "description": "Envoy's ratio is what the client actually saw, AFTER retries. vLLM's is what the pods produced. Envoy below vLLM means retries are successfully hiding pod-level failures; Envoy above vLLM means requests are failing before they reach a pod.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 47
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:envoy:error_ratio:rate5m",
              "legendFormat": "5xx at Envoy",
              "refId": "J",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:error_ratio:rate5m",
              "legendFormat": "errors at vLLM",
              "refId": "K",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "slo:objective:error_ratio",
              "legendFormat": "objective",
              "refId": "L",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "objective"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8E8E8E"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 25,
          "type": "timeseries",
          "title": "Per-tenant request rate",
          "description": "Traffic by `x-tenant` header, from Envoy virtual clusters. Only declared tenants get their own series; everything else is accounted under Envoy's built-in `other` bucket, so the totals reconcile while the series count stays fixed no matter what headers clients send. Add a tenant in k8s/20-envoy.yaml.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 47
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:tenant:requests:rate5m",
              "legendFormat": "{{envoy_virtual_cluster}}",
              "refId": "M",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 26,
          "type": "timeseries",
          "title": "Per-tenant p95 latency",
          "description": "Client-observed p95 per tenant. There is no per-tenant TOKEN rate anywhere in this stack: Envoy would have to parse response bodies to count tokens, and its Lua filter has no metrics API. Only a client can attribute tokens to a tenant, because it is the only component that knows both.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 55
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:tenant:e2e_seconds:p95",
              "legendFormat": "{{envoy_virtual_cluster}}",
              "refId": "N",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vllm-rollout
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vllm-rollout.json: |
    {
      "uid": "vllm-rollout-slo",
      "title": "vLLM Rollout & SLO",
      "description": "Service level objective state, violation windows, canary versus stable, and recovery. Thresholds come from k8s/config.env.",
      "tags": [
        "vllm",
        "inference",
        "slo",
        "rollout"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "DS_PROM",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Service level objective",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Current SLO state",
          "description": "The composite SLI: healthy only while TTFT p95, TPOT p95 and the error ratio are all within objective. An idle cluster counts as healthy -- with no traffic the latency quantiles are absent, and treating absent as violating would log every quiet period as an outage.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:healthy",
              "legendFormat": "",
              "refId": "O",
              "editorMode": "code",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "VIOLATING",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "Healthy",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Time in violation",
          "description": "Total seconds spent outside objective over the selected time range, sampled at the 15s rule interval. For the breakdown into individual incidents and their recovery times, run `flow show slo`.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 5,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sum_over_time(sli:vllm:violating[$__range:15s]) * 15",
              "legendFormat": "",
              "refId": "P",
              "editorMode": "code",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "TTFT p95",
