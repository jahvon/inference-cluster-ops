            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:output_tokens_per_gpu:rate5m",
              "legendFormat": "",
              "refId": "B",
