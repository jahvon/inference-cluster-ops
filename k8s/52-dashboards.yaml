        "vllm",
        "inference",
        "sli"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "DS_PROM",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Throughput",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Output tokens/s",
          "description": "Generated tokens per second across every replica. The headline throughput number.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:vllm:output_tokens:rate5m",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
