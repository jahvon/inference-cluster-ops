# Grafana dashboards, as code.
#
# Applied RAW -- this file is deliberately not in bootstrap.sh's MANIFESTS list, so it
# never goes through envsubst. Grafana's own templating ($__rate_interval,
# ${DS_PROM}, {{label}}) looks exactly like shell substitution, and a rendering pass
# would quietly eat it.
#
# That means no value from k8s/config.env can be interpolated here. Where a panel
# needs an SLO threshold it plots `slo:objective:*` instead -- recording rules in
# k8s/50-prometheus-rules.yaml that publish the config.env values as series. The
# number therefore lives in exactly one place.
#
# The namespace matters: the grafana sidecar only watches its own release namespace,
# so a dashboard ConfigMap in `inference` would never be discovered. The
# `grafana_dashboard: "1"` label is what the sidecar selects on.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vllm-serving
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vllm-serving.json: |
    {
      "uid": "vllm-serving-sli",
      "title": "vLLM Serving SLIs",
      "description": "Throughput, latency, saturation and errors for the vLLM fleet. Metric names are pinned to the V1 engine (vllm/vllm-openai:v0.26.x). Objective lines come from k8s/config.env via recording rules.",
