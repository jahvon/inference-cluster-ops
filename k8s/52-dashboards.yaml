        {
          "id": 17,
          "type": "timeseries",
          "title": "Truncations, rejections and retries",
          "description": "What a rollout did to in-flight requests. Three outcomes, kept apart because only one of them is repairable by a retry.\n\nTRUNCATED: cut after response headers went downstream, so the client saw a 200 with a short body. Envoy cannot retry once headers are sent, and no vLLM metric records it -- a client-disconnect abort increments nothing, and the per-request histograms skip aborted requests. This counter is the only server-side evidence.\n\nREJECTED: the client got a 5xx; retries exhausted or not retryable.\n\nMASKED: a failure the retry policy hid. Watch this move opposite to truncations as the grace period is tuned.\n\nFleet-wide only: downstream_rq_tx_reset is HCM-scoped and carries no tenant label. For per-tenant or per-pod truncations use `flow show experiment`, which reads Envoy's access log.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 30
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:envoy:truncations:rate5m",
              "legendFormat": "truncated/s",
              "refId": "U",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:envoy:rejections:rate5m",
              "legendFormat": "rejected/s",
              "refId": "V",
              "editorMode": "code",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sli:envoy:retries_masked:rate5m",
