# Gate the canary on measured behavior.
#
# ---------------------------------------------------------------------------
# The queries read the sli: recording rules from k8s/50-prometheus-rules.yaml
# rather than computing their own quantiles. The gate and the dashboards then
# show the SAME series, which is the point: when a rollout is aborted you can
# look at the panel and see the number that aborted it.
#
# The window is ROLLOUT_WINDOW, shared with those rules. There is no separate
# gate window or gate quantile to drift out of sync.
# ---------------------------------------------------------------------------
# Every query ends in `>= 0`, and that is load-bearing.
#
# With no traffic in the window, histogram_quantile does not return an empty vector
# -- it returns NaN. `len(result) == 0` therefore does NOT catch the idle case: the
# result has one element whose value is NaN, and `NaN < threshold` is false, so the
# gate records a failure. Two of those and a perfectly healthy rollout is aborted for
# the sole reason that nobody sent it any traffic.
#
# `>= 0` is a filter: NaN fails it, the series drops out, the result really is empty,
# and the len() guard does its job.
#
# It also means a canary that is not serving yet reads as PASSING. That is correct
# for an idle fleet and wrong for a cold start, where "not serving" is the failure --
# ---------------------------------------------------------------------------
# Truncations are deliberately absent. They are counted at Envoy's downstream
# listener, which has no canary/stable dimension, so the gate cannot attribute one
# to the revision under test. The SLO counts them; the gate cannot.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: vllm-latency
  namespace: inference
spec:
  metrics:
    - name: p95-ttft
      # A pod that has served nothing produces no histogram. Wait one full window
      # before the first query, so that query covers a complete window.
      initialDelay: ${GATE_INITIAL_DELAY}
      interval: ${GATE_INTERVAL}
      count: ${GATE_COUNT}
      successCondition: "len(result) == 0 || result[0] < ${TTFT_P95_THRESHOLD}"
      failureLimit: ${GATE_FAILURE_LIMIT}
      consecutiveErrorLimit: 3
      provider:
        prometheus:
          address: ${PROM_URL}
          query: |
            sli:vllm:ttft_seconds:p95:by_role:rollout{role="canary"} >= 0

    # Decode speed. TTFT can look perfect while generation crawls -- a change that
    # slows per-token decode shows up here and nowhere else in this template.
    - name: p95-tpot
      initialDelay: ${GATE_INITIAL_DELAY}
      interval: ${GATE_INTERVAL}
      count: ${GATE_COUNT}
      successCondition: "len(result) == 0 || result[0] < ${TPOT_P95_THRESHOLD}"
      failureLimit: ${GATE_FAILURE_LIMIT}
      consecutiveErrorLimit: 3
      provider:
        prometheus:
          address: ${PROM_URL}
          query: |
            sli:vllm:tpot_seconds:p95:by_role:rollout{role="canary"} >= 0

    # Correctness, not speed: a canary that is fast because it is failing fast would
    # sail through both latency gates above.
    - name: error-ratio
      initialDelay: ${GATE_INITIAL_DELAY}
      interval: ${GATE_INTERVAL}
      count: ${GATE_COUNT}
      successCondition: "len(result) == 0 || result[0] < ${ERROR_RATIO_SLO}"
      failureLimit: ${GATE_FAILURE_LIMIT}
      consecutiveErrorLimit: 3
      provider:
        prometheus:
          address: ${PROM_URL}
          query: |
            sli:vllm:error_ratio:by_role:rollout{role="canary"} >= 0
